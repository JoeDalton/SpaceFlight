test_linux:
  stage: test
  tags:
    - linux_poetry
  script:
    - invoke develop-full cover
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test_windows:
  stage: test
  tags:
    - windows_poetry
  script:
    - invoke develop-full test

quality:
  stage: test
  tags:
    - linux_poetry
  script:
    - invoke develop-full quality

deploy:
  stage: deploy
  tags:
    - linux_poetry
  script:
    - invoke install deploy
  only:
    - tags
    - develop

input_type: gamepad
global:
  pause: escape
dead_zones:
  stick: 0.15
  throttle: 0.04
contexts:
  flight:
    keyboard:
      throttle_up: arrow_up
      throttle_down: arrow_down
      pitch_up: s
      pitch_down: z
      roll_left: q
      roll_right: d
      yaw_left: a
      yaw_right: e
      view_up: i
      view_down: k
      view_left: j
      view_right: l
      fire: space
      drop_bomb: x
      boost_on: b
      boost_off: b
      pause: escape
      loop_target: ','
      loop_target_reverse: ':'
      point_target: ;
      toggle_mirror: alt
      radial_menu: r
    gamepad:
      throttle: right_trigger
      invert_throttle: false
      yaw: right_x
      invert_yaw: true
      pitch: left_y
      invert_pitch: true
      roll: left_x
      invert_roll: false
      fire: gamepad_lshoulder
      drop_bomb: gamepad_face_x
      boost_on: gamepad_rshoulder
      boost_off: gamepad_rshoulder
      pause: gamepad_start
      loop_target: gamepad_dpad_right
      loop_target_reverse: gamepad_dpad_left
      point_target: gamepad_dpad_up
      toggle_mirror: gamepad_back
      radial_menu: gamepad_dpad_down
    joystick:
      throttle: throttle
      invert_throttle: false
      yaw: yaw
      invert_yaw: false
      pitch: pitch
      invert_pitch: false
      roll: roll
      invert_roll: false
      view_up: stick_button_19
      view_down: stick_button_18
      view_left: stick_button_16
      view_right: stick_button_17
      fire: stick_button_1
      drop_bomb: stick_button_2
      boost_on: stick_button_8
      boost_off: stick_button_8
      loop_target: stick_button_9
      loop_target_reverse: stick_button_10
      point_target: stick_button_11
      toggle_mirror: stick_button_12
      radial_menu: stick_button_3
  radial_menu:
    keyboard:
      dir_up: i
      dir_down: k
      dir_left: j
      dir_right: l
    gamepad:
      axis_x: right_x
      axis_y: right_y
    joystick:
      axis_x: roll
      axis_y: pitch
  hyperspace:
    keyboard:
      drop_hyperspace: space
    gamepad:
      drop_hyperspace: gamepad_lshoulder
    joystick:
      drop_hyperspace: stick_button_1

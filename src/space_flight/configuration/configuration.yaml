input_type: gamepad # keyboard, gamepad, joystick

# Keyboard bindings
keyboard_bindings:
  throttle_up: arrow_up
  throttle_down: arrow_down
  pitch_up: s
  pitch_down: z
  roll_left: q
  roll_right: d
  yaw_left: a
  yaw_right: e
  loop_target: "9"
  loop_target_reverse: "7"
  point_target: "8"
  toggle_mirror: alt
  fire_primary: space
  boost: b

# TODO: Joystick and/or gamepad bindings
stick_dead_zone: 0.25
throttle_dead_zone: 0.04

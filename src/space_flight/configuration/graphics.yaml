# Default graphics settings (read-only), under the user-editable
# configuration/graphics.yaml (see
# space_flight.global_architecture.graphics_settings).

display:
  mode: fullscreen        # fullscreen | windowed
  windowed_size: [1600, 900]

mirror:
  # The rear-view mirror: its resolution, as a share of its size on screen
  # (1 native, 0.33 to 1), and its anti-aliasing and upscaling to that size
  # (FSR 1 takes the main view's sharpness, world.render).
  scale: 0.5
  msaa: 0                 # 0 | 2 | 4 | 8 | 16
  fxaa: false
  fsr: false

compatibility:
  alternate_model_orientation: true

hud:
  # Show the live FPS readout in the top-right corner.
  fps_counter: true

world:
  # WorldBuilder's quality settings (terrain, air, sky, clouds, ocean, and the
  # render section: render scale, MSAA, FXAA, the FSR 1 upscaler): a preset
  # (low | mid | high | ultra) and the knobs that differ from it, by section, as
  # WorldSettings.to_dict() writes them. The knobs, their ranges and presets are
  # WorldBuilder's: see its docs/source/quality.md.
  version: 1
  preset: high
  overrides: {}

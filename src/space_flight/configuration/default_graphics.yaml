# User graphics settings, layered over default_graphics.yaml (see
# space_flight.global_architecture.graphics_settings). Saving from the in-game
# graphics menu rewrites this file without comments.

display:
  mode: fullscreen        # fullscreen | windowed
  windowed_size: [1600, 900]

render:
  # Internal 3D render resolution as a fraction of the window resolution.
  # 1.0 = native; lower renders the 3D scene smaller and upscales it to the
  # window (the HUD stays crisp). Useful on old hardware in fullscreen.
  scale: 1.0
  # Ocean planar-reflection buffer resolution, as a fraction of the 3D render
  # resolution. Lower is cheaper and blurrier.
  reflection_scale: 0.5
  # Rear-view mirror resolution, as a multiple of its 128px base height.
  mirror_scale: 0.5

antialiasing:
  msaa: 0                 # hardware multisampling: 0 | 2 | 4 | 8
  fxaa: false             # post-process anti-aliasing (on/off)

compatibility:
  alternate_model_orientation: true

hud:
  # Show the live FPS readout in the top-right corner.
  fps_counter: true

clouds:
  # How much the volumetric clouds are allowed to cost: low | mid | high | ultra.
  # "high" is what the cloud presets are authored at. Each step scales the
  # billboard budget (x0.25 / x0.5 / x1 / x2) and, much more gently, the sun
  # march's step count. Halving the billboards leaves a cloud exactly as opaque
  # -- extinction is derived from the placement -- so this trades how uniformly
  # the volume is covered, not how the clouds read.
  quality: high

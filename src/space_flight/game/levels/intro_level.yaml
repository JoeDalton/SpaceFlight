# Wave data for the intro level.
#
# `waves` are reusable spawn definitions, keyed by the group id they spawn
# into. The mission's actual sequence of events (waves' timing, chained
# reinforcements, win/lose conditions) is written in Python, in the sibling
# intro_level.py, using the Mission API (see
# docs/source/scenario_scripting.md). Only wave data lives here now.

waves:

  transports:
    size: 3
    ship_model: cr-90 #gr-75
    bot_type: capital_ship
    team: 1
    spawn_point: [0, -2000, 200]
    spawn_orientation: [1, 0, 0, 0]
    formation: { scale_m: 150, shape: arrowhead }
    waypoints:
      - [0000, 0000, 200]
      - [0000, 3000, 200]
      - [0500, 4000, 200]
      - [1000, 4500, 200]
      - [2000, 5000, 200]
      - [5000, 5000, 200]
      - [6000, 4500, 200]
      - [6500, 4000, 200]
      - [7000, 3000, 200]

  escort:
    size: 6
    ship_model: x-wing
    bot_type: fighter
    team: 1
    spawn_point: [200, -2100, 300]
    spawn_orientation: [1, 0, 0, 0]
    formation: { scale_m: 30, shape: arrowhead }
    waypoints:
      - [0200, 0000, 300]
      - [0200, 3000, 300]
      - [0700, 4000, 300]
      - [1200, 4500, 300]
      - [2200, 5000, 300]
      - [5200, 5000, 300]
      - [6200, 4500, 300]
      - [6700, 4000, 300]
      - [7200, 3000, 300]

  first_wave:
    size: 5
    ship_model: tie-bomber
    bot_type: fighter
    team: 2
    spawn_point: [300, 6000, 500]
    spawn_orientation: [0, 0, 0, 1]
    formation: { scale_m: 30, shape: arrowhead }
    waypoints:
      - [300, 0, 500]
      - [300, -6000, 500]
    target: transports
    #hud_text: "Enemy ships incoming!"

  second_wave:
    size: 5
    ship_model: tie-interceptor
    bot_type: fighter
    team: 2
    spawn_point: [300, 6300, 800]
    spawn_orientation: [0, 0, 0, 1]
    formation: { scale_m: 30, shape: diamond }
    waypoints:
      - [300, 0, 500]
      - [300, -6000, 500]
    target: escort

  third_wave:
    size: 8
    ship_model: tie-bomber
    bot_type: fighter
    team: 2
    spawn_point: [300, 0, 800]
    spawn_orientation: [0, 0, 0, 1]
    formation: { scale_m: 30, shape: diamond }
    waypoints:
      - [300, 6000, 500]
      - [300, 0, 500]
    target: transports

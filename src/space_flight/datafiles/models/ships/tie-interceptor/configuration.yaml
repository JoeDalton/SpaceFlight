# TIE-interceptor
mass_kg: 110
inputs_filter_time_s: 0.3
max_thrust_n: 14450
brake_factor_nspm: 75
max_pitch_rate_degps: 60
max_yaw_rate_degps: 30
max_roll_rate_degps: 150
drag_coefficient: 0.1
lift_coefficient_slope_pdeg: 0.1
lateral_lift_coefficient_slope_pdeg: 0.05
reference_surface_m2: 10
lift_inefficiency: 0.0005  # = 1/(pi * AR * e)

health: 1000.0
shield: 0.0
shield_regen_rate: 0.0
hit_box_radius_m: 4.0

laser_base_range_m: 1500
laser_color: green
laser_fire_rate: 9.1
cannon_positions: [[-0.5, 5, -1], [0.5, 5, -1]]
laser_sound: sounds/weapons/TIE_BLASTER.wav
shot_power: 75.0

# Engine and laser gauges, in energy units (the scale of damage, which ion hits
# drain them by). Rates are per second, the regen rates at full plant power.
energy:
  engine_capacity: 300.0
  laser_capacity: 300.0
  engine_regen_rate: 45.0
  laser_regen_rate: 45.0
  boost_drain_rate: 36.0
  hard_maneuver_drain_rate: 24.0
  laser_shot_cost: 4.5

# Default weapons (see space_flight.weapons.loadout): the cannons' damage type
# (physical or ion) and the ordnance stocks, in secondary cycling order
loadout:
  lasers: physical
  ordnance:
    concussion_missile: 6
    rocket: 12
    flare: 10

explosion_scale: 5.0
death_spin_duration_s: 2.5
death_max_tumble_rate_degps: 450.0
cockpit_spark_emitters: models/ships/tie_common/cockpit/spark_emitters.yaml

exterior_engine_sound: sounds/engines/tie_common/tie_ext_high.ogg
interior_engine_sound: sounds/engines/tie_common/tie_int_high.ogg

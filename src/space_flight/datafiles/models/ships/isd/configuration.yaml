# Imperial-class Star Destroyer
# Model: models/star_wars_imperial-class_star_destroyer (shared with the scenery).
# Ship frame (see ShipModel): bow +Y (y = +791), stern y = -796, beam x = +/-445,
# keel z = -108, top of the bridge domes z = +332. About 1 unit = 1 m.

# A true capital ship: scripted, it only patrols the waypoints it is given, with
# no tactician and no collision avoidance (see CapitalShip)
ship_class: capital

mass_kg: 50000
inputs_filter_time_s: 3.0
max_thrust_n: 160000  # top speed sqrt(160000 / (0.5 * 2000 * 0.1)) = 40 m/s
brake_factor_nspm: 6000
max_pitch_rate_degps: 0.5
max_yaw_rate_degps: 2.0
max_roll_rate_degps: 1.0
drag_coefficient: 0.1
lift_coefficient_slope_pdeg: 0.1
lateral_lift_coefficient_slope_pdeg: 0.05
reference_surface_m2: 2000
lift_inefficiency: 0.0  # = 1/(pi * AR * e)

health: 60000.0
# Placeholder hull sphere, centred on the ship origin: it only covers the
# mid-hull (bow and stern are not collidable), and is deliberately small enough
# for the ventral hangar's launch point (~145 m from the origin) to lie outside
# it. TODO proper hull collider (capsule/mesh)
hit_box_radius_m: 120.0

explosion_scale: 300.0
death_spin_duration_s: 8.0
death_max_tumble_rate_degps: 4.0

exterior_engine_sound: sounds/engines/capital_ships/test_capital_ext.ogg
# interior_engine_sound: sounds/test_interior.ogg

sub_systems:
  # Shield generators: the two bridge domes, together projecting the shared
  # shield below (see docs/source/subsystems.md).
  shield_generators:
    - relative_position: [91.0, -615.0, 322.0]
      hit_box_radius_m: 20.0
      health: 3000.0
      explosion_scale: 60.0
    - relative_position: [-91.0, -615.0, 322.0]
      hit_box_radius_m: 20.0
      health: 3000.0
      explosion_scale: 60.0

  # The one shared shield the generators above project: a capsule along the
  # hull (placeholder dimensions).
  shield:
    shape:
      type: tube
      point_a: [0.0, -550.0, 60.0]
      point_b: [0.0, 450.0, 60.0]
      radius_m: 480.0
    health: 40000.0
    regen_rate: 100.0
    color: [0.4, 0.8, 1.0, 0.1]

  # Targeting system: the bridge tower. While alive, it gives every turret on
  # this ship auto-aim and a faster rate of fire.
  targeting_systems:
    - relative_position: [0.0, -585.0, 255.0]
      hit_box_radius_m: 15.0
      health: 2000.0
      explosion_scale: 40.0
      fire_rate_multiplier: 2.0
      auto_aim:
        target_lock_delay_s: 0.5
        acquisition_cone_angle_deg: 30.0
        max_assist_angle_deg: 8.0
        max_assist_distance_m: 2000.0

  # Bot-controlled turrets in the side trenches (placeholder model and
  # positions); base_position/orientation are ship-local.
  turrets:
    - turret_type: test
      base_position: [330.0, -500.0, 75.0]
      base_orientation: [1.0, 0.0, 0.0, 0.0]
      ini_yaw_deg: 0.0
      ini_pitch_deg: 30.0

    - turret_type: test
      base_position: [-330.0, -500.0, 75.0]
      base_orientation: [1.0, 0.0, 0.0, 0.0]
      ini_yaw_deg: 0.0
      ini_pitch_deg: 30.0

    - turret_type: test
      base_position: [330.0, -250.0, 75.0]
      base_orientation: [1.0, 0.0, 0.0, 0.0]
      ini_yaw_deg: 0.0
      ini_pitch_deg: 30.0

    - turret_type: test
      base_position: [-330.0, -250.0, 75.0]
      base_orientation: [1.0, 0.0, 0.0, 0.0]
      ini_yaw_deg: 0.0
      ini_pitch_deg: 30.0

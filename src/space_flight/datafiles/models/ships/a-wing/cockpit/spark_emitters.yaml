# A-wing cockpit spark emitters. Positions and normals in the ship BODY frame
# (X right, Y forward, Z up), metres, relative to the ship node; sparks spawn at
# each position and streak out along its normal.
#
# NOTE: placeholder layout -- tune to the actual A-wing cockpit geometry (points
# must sit ahead of the camera near-plane to be visible).
emitters:
  - position: [-0.35, 1.9, 0.2]
    normal: [0.5, -0.7, -0.5]
  - position: [0.35, 1.9, 0.2]
    normal: [-0.5, -0.7, -0.5]
  - position: [-0.28, 1.8, -0.3]
    normal: [0.4, -0.6, 0.7]
  - position: [0.28, 1.8, -0.3]
    normal: [-0.4, -0.6, 0.7]
  - position: [0.0, 1.85, -0.35]
    normal: [0.0, -0.7, 0.7]

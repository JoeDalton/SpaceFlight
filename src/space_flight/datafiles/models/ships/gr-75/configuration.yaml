# GR-75
mass_kg: 800
physics_filter_time_s: 1.0
max_thrust_n: 12500
brake_factor_nspm: 100
max_pitch_rate_degps: 1.0
max_yaw_rate_degps: 5.0
max_roll_rate_degps: 5.0
drag_coefficient: 0.1
lift_coefficient_slope_pdeg: 0.1
lateral_lift_coefficient_slope_pdeg: 0.05
reference_surface_m2: 100

health: 10000.0
hit_box_radius_m: 30.0

explosion_scale: 50.0

exterior_engine_sound: sounds/engines/capital_ships/test_capital_ext.ogg
# interior_engine_sound: sounds/test_interior.ogg

sub_systems:
  # Bot-controlled turrets mounted on the hull. Each is spawned as its own bot
  # whose pawn is mounted on the ship; base_position/orientation are ship-local.
  #turrets:
  #  - turret_type: test
  #    base_position: [0.0, 0.0, 20.0]  # on top of the hull
  #    base_orientation: [1.0, 0.0, 0.0, 0.0]
  #    ini_yaw_deg: 0.0
  #    ini_pitch_deg: 30.0

  # Bot-controlled tractor beam projectors. Each tracks a prey and, once it is in
  # the antenna's cone and range, reels it in with drag + attraction until the
  # prey breaks free or the grab times out. base_position/orientation ship-local.
  tractor_beams:
    - tractor_beam_type: test
      base_position: [0.0, 0.0, -20.0]  # under the hull
      base_orientation: [0.0, 1.0, 0.0, 0.0]
      ini_yaw_deg: 0.0
      ini_pitch_deg: 30.0

# GR-75
mass_kg: 800
physics_filter_time_s: 1.0
max_thrust_n: 12500
brake_factor_nspm: 100
max_pitch_rate_degps: 1.0
max_yaw_rate_degps: 5.0
max_roll_rate_degps: 5.0
drag_coefficient: 0.1
lift_coefficient_slope_pdeg: 0.1
lateral_lift_coefficient_slope_pdeg: 0.05
reference_surface_m2: 100

health: 10000.0
hit_box_radius_m: 30.0

explosion_scale: 50.0
death_spin_duration_s: 4.5
death_max_tumble_rate_degps: 20.0

exterior_engine_sound: sounds/engines/capital_ships/test_capital_ext.ogg
# interior_engine_sound: sounds/test_interior.ogg

sub_systems:
  # Bot-controlled turrets mounted on the hull. Each is spawned as its own bot
  # whose pawn is mounted on the ship; base_position/orientation are ship-local.
  #turrets:
  #  - turret_type: test
  #    base_position: [0.0, 0.0, 20.0]  # on top of the hull
  #    base_orientation: [1.0, 0.0, 0.0, 0.0]
  #    ini_yaw_deg: 0.0
  #    ini_pitch_deg: 30.0

  # Bot-controlled tractor beam projectors. Each tracks a prey and, once it is in
  # the antenna's cone and range, reels it in with drag + attraction until the
  # prey breaks free or the grab times out. base_position/orientation ship-local.
  # tractor_beams:
  #   - tractor_beam_type: test
  #     base_position: [0.0, 0.0, -20.0]  # under the hull
  #     base_orientation: [0.0, 1.0, 0.0, 0.0]
  #     ini_yaw_deg: 0.0
  #     ini_pitch_deg: 30.0

  # Shield generators: external subsystems that TOGETHER project the single
  # shared shield defined below. Every generator contributes an equal share of
  # the shield's perks, so destroying one scales the shield's strength and regen
  # down pro rata (remaining / initial); destroying the last one drops it for
  # good. relative_position is relative to the ship node; radius/health values
  # are tunable placeholders until the hull dimensions are pinned down.
  shield_generators:
    - relative_position: [0.0, 0.0, 15.0]
      hit_box_radius_m: 6.0
      health: 1.0
      explosion_scale: 20.0
    - relative_position: [0.0, 0.0, -15.0]
      hit_box_radius_m: 6.0
      health: 1.0
      explosion_scale: 20.0

  # The one shared shield the generators above project. Its full-strength perks
  # (health, regen_rate) apply while all generators are alive.
  shield:
    # Geometry: a "sphere" or "tube" primitive, or a shared "model" path.
    # The visible bubble and the collision solid share this geometry.
    # Tube = capsule between point_a and point_b (ship-local); dimensions
    # here are placeholders until the hull is measured.
    shape:
      type: tube
      point_a: [0.0, -40.0, 0.0]
      point_b: [0.0, 40.0, 0.0]
      radius_m: 50.0
    health: 20000.0
    regen_rate: 25.0
    color: [0.4, 0.8, 1.0, 0.15]

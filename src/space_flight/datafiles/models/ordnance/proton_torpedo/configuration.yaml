# Proton torpedo: hard-hitting, slow-turning guided missile
type: missile
life_time_s: 10.0
damage: 2000.0
damage_type: physical
reload_s: 5.0
# Launch: speed relative to the launching ship, kept for its whole life
launch_direction: forward
speed_mps: 250.0
launch_offset_m: 0.0
# Guidance turn rates
max_pitch_rate_degps: 20.0
max_yaw_rate_degps: 20.0
max_roll_rate_degps: 360.0
# Target lock: the target must stay within lock_cone_angle_deg of the nose for
# lock_delay_s before a missile launched at it is guided to it
lock_delay_s: 5.0
lock_cone_angle_deg: 10.0
# The targets it is fired at, by mobility (see the tactician's
# strafe_mobility_threshold): "agile" ones (fighters) or "slow" ones (capital
# ships, structures)
target_mobility: slow
# Flares: one dropped by its target within decoy_range_m of the missile and
# within decoy_cone_angle_deg of its nose lures it with probability decoy_chance
decoy_range_m: 300.0
decoy_cone_angle_deg: 15.0
decoy_chance: 0.4
# Placeholder look and collision
visual_radius_m: 0.5
collision_radius_m: 1.0
color: [1.0, 0.5, 0.0, 1.0]

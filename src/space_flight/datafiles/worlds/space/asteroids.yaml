# Missions 1 and 2: open space under a violet nebula, with the asteroid field.
# A world file defines the objects and nothing about running them (no quality,
# no camera, no clock). Metres, world frame; the sun is one direction (toward
# it) and a colour. The sky light away from every body is strong and blue.
sun:
  direction: [-0.42, -0.84, 0.35]
  color: [0.35, 0.32, 0.3]
  angular_radius: 0.0009599310885968814
sky: {file: sky.yaml}
space_ambient: [0.05, 0.07, 0.1]
bodies: []
fields:
  - {name: field, file: asteroid_field.yaml, position: [0.0, 0.0, 0.0], axis: [0.0, 0.0, 1.0]}

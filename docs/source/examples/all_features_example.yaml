# Wave data for the all-features example mission
# (../../src/space_flight/game/scenario/../examples/all_features_example.py --
# see that file's module docstring).
#
# This is a documentation/reference example, not a shipped level: every wave
# below exists only to exercise one particular feature of wave data, so the
# roster and story make no narrative sense together. Copy the *pattern*, not
# the content, into a real level's own YAML.

waves:

  # A basic wave: just the three required-ish fields (id is implicit, the
  # YAML key), no formation, no waypoints -- spawns in a centred line.
  # `record: true` asks the game to step-by-step-record every bot of this wave.
  homeguard:
    size: 1
    ship_model: cr-90
    bot_type: capital_ship
    team: 1
    spawn_point: [0, -1000, 200]
    record: true

  # A single-model wave that spawns in formation and patrols a looping route.
  # No `target:` here -- the mission body passes target= at spawn time
  # instead, to demonstrate the runtime override (see all_features_example.py).
  strike_wave:
    size: 4
    ship_model: tie-fighter
    bot_type: fighter
    team: 2
    spawn_point: [0, 5000, 500]
    formation: { scale_m: 30, shape: diamond }
    waypoints:
      - [0, 0, 500]
      - [0, -5000, 500]
    loop: true
    hud_text: "Strike wave inbound!"
    hud_time_s: 3

  # No `formation:` of its own -- the mission body spawns this wave with
  # join=strike_wave.formation, so it attaches to strike_wave's existing
  # formation instead of spawning as a separate cluster. `target:` IS given
  # here (as opposed to strike_wave's runtime override above), to demonstrate
  # the static, declarative form of targeting.
  reinforcements:
    size: 2
    ship_model: tie-interceptor
    bot_type: fighter
    team: 2
    spawn_point: [0, 5000, 500]
    target: homeguard

  # A mixed-composition wave: ship_model is a list of {ship_model, count}
  # entries instead of one bare model name, so `size` can be omitted (it is
  # inferred as the sum of the counts -- 2 + 1 = 3 here). spawn_orientation is
  # also given explicitly here (the default, [0, 0, 0, 1], is a 180 degree
  # turn about z, not the identity).
  boarding_party:
    ship_model:
      - { ship_model: tie-bomber, count: 2 }
      - { ship_model: tie-interceptor, count: 1 }
    bot_type: fighter
    team: 2
    spawn_point: [200, 5200, 600]
    spawn_orientation: [1, 0, 0, 0]

  # Starts neutral (team: 0) and short-pathed on purpose: the mission body
  # waits for it to reach waypoint 0, then reroutes it live with
  # set_waypoints(), reassigns its team live with set_team(), and retargets it
  # live with set_targets() -- the three "on the fly" asks from issue #85.
  patrol:
    size: 1
    ship_model: y-wing
    bot_type: fighter
    team: 0
    spawn_point: [500, 0, 500]
    waypoints:
      - [500, 1000, 500]
      - [500, 2000, 500]
    loop: false

  # allow_respawn: true is what lets the mission body spawn this same wave id
  # twice; without it, the second Mission.spawn call would be skipped with a
  # warning (a wave id is a one-shot identity group by default).
  respawnable_probe:
    size: 1
    ship_model: tie-fighter
    bot_type: fighter
    team: 2
    spawn_point: [0, 0, 1000]
    allow_respawn: true

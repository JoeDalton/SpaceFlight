# All-features reference example for the LEGACY YAML trigger DSL
# (space_flight.game.scenario.loader.load_scenario).
#
# See all_features_example.py / .yaml for the current, primary way to author
# a mission (the Python Mission API). This file is the DSL's own equivalent --
# still fully supported by loader.py, and worth keeping around for a level
# whose whole mission is a handful of independent, purely time/condition
# rules with nothing sequential about them (see
# docs/source/scenario_scripting.md#legacy-the-yaml-trigger-dsl).
#
# Every `when`/`then` keyword the loader understands appears at least once
# below. It is not a shipped level's scenario file and is only ever loaded
# by tests/test_all_features_example.py.

waves:
  homeguard:
    size: 1
    ship_model: cr-90
    bot_type: capital_ship
    team: 1
    spawn_point: [0, -1000, 200]

  strike_wave:
    size: 2
    ship_model: tie-fighter
    bot_type: fighter
    team: 2
    spawn_point: [0, 5000, 500]
    formation: { scale_m: 30, shape: diamond }
    waypoints:
      - [0, 0, 500]
      - [0, -5000, 500]
    target: homeguard

triggers:
  # after_seconds: the simplest condition.
  - name: spawn_homeguard
    when: { after_seconds: 0 }
    then: { spawn: homeguard }

  # `all` runs several actions in sequence when the trigger fires.
  - name: spawn_strike_wave
    when: { after_seconds: 1 }
    then:
      all:
        - { hud_text: "Strike wave inbound!" }
        - spawn: strike_wave
        - speech:
            speaker: "Ops"
            text: "Contact bearing zero-two-zero."
            display_time_s: 3

  # any_destroyed: true from the first loss onward (stays true after a total
  # wipe too).
  - name: homeguard_hit
    when: { any_destroyed: homeguard }
    then:
      speech:
        speaker: "Ops"
        text: "We're taking losses!"

  # all_destroyed + delay + fired, chained: an ending 3s after a wipe.
  - name: homeguard_wiped
    when: { all_destroyed: homeguard }
    then: { hud_text: "The home guard has fallen." }

  - name: defeat
    when:
      delay:
        after: { fired: homeguard_wiped }
        seconds: 3
    then: { end_level: { outcome: defeat, text: "The home guard was destroyed." } }

  # any_alive: true while at least one member remains.
  - name: strike_wave_present
    when: { any_alive: strike_wave }
    then: { hud_text: "Enemy fighters detected." }

  # reached_waypoint: true once any live member has reached waypoint index 1
  # (0-based) of the wave's own patrol route.
  - name: strike_wave_turned_back
    when: { reached_waypoint: { who: strike_wave, index: 1 } }
    then: { hud_text: "Strike wave turning back." }

  # near: true while `who` (here, "player") is within radius of point.
  - name: proximity_warning
    when: { near: { who: player, point: [0, -1000, 200], radius: 500 } }
    then: { hud_text: "Danger close to the home guard!" }
    once: false # repeats every frame the condition holds, instead of once

  # all_of / any_of combinators, and player_waypoints (both accepted forms).
  - name: victory
    when:
      all_of:
        - { all_destroyed: strike_wave }
        - any_of:
            - { fired: homeguard_hit }
            - { after_seconds: 30 }
    then:
      all:
        - player_waypoints:
            points: [[0, 1000, 500]]
            arrival_radius_m: 200
        - end_level: { outcome: victory, text: "The blockade is broken." }

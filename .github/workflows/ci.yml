name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test_linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install poetry invoke poetry-dynamic-versioning
      - run: poetry install
      - run: invoke coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  test_windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install poetry invoke poetry-dynamic-versioning
      - run: poetry install
      - run: invoke test

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install poetry invoke poetry-dynamic-versioning
      - run: invoke develop quality

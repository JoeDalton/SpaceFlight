name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test_linux:
    runs-on: ubuntu-latest  # x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # newest the project supports (python < 3.15)
      - run: pip install poetry invoke poetry-dynamic-versioning
      - run: poetry install
      - run: invoke coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # Every other platform WorldBuilder ships a wheel for (its compiled terrain
  # collision library included).
  test_other_os:
    strategy:
      # Let every platform finish when one fails
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04-arm  # arm64
          - runner: windows-latest  # x86_64
          - runner: macos-latest  # arm64
          - runner: macos-15-intel  # x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # newest the project supports (python < 3.15)
      - run: pip install poetry invoke poetry-dynamic-versioning
      - run: poetry install
      - run: invoke test

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"  # newest the project supports (python < 3.15)
      - run: pip install poetry invoke poetry-dynamic-versioning
      - run: invoke develop quality
